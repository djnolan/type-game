# Builds the branch that was pushed and publishes it to the gh-pages branch, so
# the latest push from any branch is what GitHub Pages serves. This is a dev
# preview, so the level editor and #/play routes are included.
name: Deploy preview to GitHub Pages

on:
  push:
    branches-ignore: [gh-pages]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          VITE_ENABLE_EDITOR: 'true'
      - name: Publish dist to gh-pages
        run: |
          cd dist
          touch .nojekyll
          echo "${GITHUB_REF_NAME} @ ${GITHUB_SHA::7}" > version.txt
          git init -q -b gh-pages
          git add -A
          git -c user.name="github-actions[bot]" -c user.email="41898283+github-actions[bot]@users.noreply.github.com" \
            commit -q -m "Deploy ${GITHUB_REF_NAME} @ ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" gh-pages
